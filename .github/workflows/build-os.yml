name: Build Custom C++ OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean APT and Fix Mirror Issues
        run: |
          echo "=== Dọn dẹp cache APT bị lỗi ==="
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get autoclean
          
          echo "=== Chạy cập nhật hệ thống kèm cơ chế chống lỗi mạng ==="
          sudo apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::No-Cache=true \
            -o Acquire::https::No-Cache=true

      - name: Install All Boot Tools and Dependencies
        run: |
          echo "=== Cài đặt trình biên dịch và công cụ tạo ISO ==="
          sudo apt-get install -y --fix-missing \
            gcc-i686-linux-gnu g++-i686-linux-gnu \
            grub-pc-bin xorriso mtools dosfstools libisoburn

      - name: Compile Source Files
        run: |
          echo "=== Biên dịch boot.s ==="
          i686-linux-gnu-as boot.s -o boot.o
          
          echo "=== Biên dịch kernel.cpp ==="
          i686-linux-gnu-g++ -c kernel.cpp -o kernel.o \
            -ffreestanding -O2 -Wall -Wextra \
            -fno-exceptions -fno-rtti

      - name: Link Kernel Binary
        run: |
          echo "=== Liên kết mã nguồn tạo file nhị phân ==="
          i686-linux-gnu-gcc -T linker.ld -o myos.bin \
            -ffreestanding -O2 -nostdlib boot.o kernel.o -lgcc -Wl,-Map,output.map

      - name: Structure ISO Directory Tree
        run: |
          mkdir -p isodir/boot/grub
          cp myos.bin isodir/boot/myos.bin
          
          if [ -f grub.cfg ]; then
            cp grub.cfg isodir/boot/grub/grub.cfg
          else
            echo "=== Tự động tạo grub.cfg dự phòng ==="
            cat <<EOF > isodir/boot/grub/grub.cfg
          menuentry "My Custom C++ OS" {
              multiboot /boot/myos.bin
              boot
          }
          EOF
          fi

      - name: Build Bootable ISO
        run: |
          echo "=== Đóng gói xuất file ISO ==="
          grub-mkrescue -o myos.iso isodir

      - name: Upload ISO Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso
          path: myos.iso
