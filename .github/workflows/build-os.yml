name: Build MacOS-RedStar Hybrid OS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso squashfs-tools

      - name: Setup Live Build Environment
        run: |
          mkdir my-os && cd my-os
          lb config --architecture amd64 \
                    --distribution noble \
                    --binary-images iso-hybrid \
                    --memtest none

      - name: Customize OS Packages (Interface & Setup)
        run: |
          # Khai báo các gói phần mềm cần cài sẵn vào ISO
          mkdir -p my-os/config/package-lists
          cat <<EOF > my-os/config/package-lists/desktop.list.chroot
          # Hệ thống nền và Giao diện đồ họa
          xorg
          xfce4
          xfce4-goodies
          plank
          
          # Trình cài đặt đồ họa (Setup Wizard)
          calamares
          calamares-settings-ubuntu
          
          # Tiện ích bổ sung cấu hình giống macOS
          valpanel
          lightdm
EOF

      - name: Inject Custom Themes and Backgrounds
        run: |
          # Tạo thư mục chứa file cấu hình hệ thống đồ họa của ISO
          mkdir -p my-os/config/includes.chroot/etc/skel/.config/plank/dock1
          mkdir -p my-os/config/includes.chroot/usr/share/backgrounds/
          
          # [Bước tùy biến]: Bạn có thể bỏ file ảnh nền RedStar OS hoặc script tự động chỉnh giao diện macOS vào đây.
          echo "# Cấu hình tự khởi động các thanh Dock giống macOS" > my-os/config/includes.chroot/etc/skel/.desktop

      - name: Build the OS ISO
        run: |
          cd my-os
          sudo lb build

      - name: Upload Finished ISO
        uses: actions/upload-artifact@v4
        with:
          name: macOS-RedStar-OS-ISO
          path: my-os/*.iso
