name: Build DuyKhanhOS Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pure ISO Generation Tools
        run: |
          # Chỉ cài đặt duy nhất công cụ đúc đĩa cơ bản, không chạy apt nâng cấp hệ thống để tránh lỗi 100
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin mtools dosfstools

      - name: Structure Clean ISO Tree
        run: |
          # Xóa sạch toàn bộ dữ liệu rác cũ để giải phóng đĩa cứng ảo bị tràn
          sudo rm -rf chroot_dir image duykhanhos-production.iso
          mkdir -p chroot_dir
          mkdir -p image/live

          # Chỉ sao chép các tệp tin nhị phân cốt lõi cơ bản nhất để hệ thống hoạt động
          sudo cp -a /bin chroot_dir/bin
          sudo cp -a /sbin chroot_dir/sbin
          sudo cp -a /lib chroot_dir/lib
          sudo cp -a /lib64 chroot_dir/lib64
          sudo cp -a /etc chroot_dir/etc

          # Khởi tạo các thư mục hệ thống trống bắt buộc
          sudo mkdir -p chroot_dir/proc chroot_dir/sys chroot_dir/dev chroot_dir/run chroot_dir/tmp chroot_dir/boot chroot_dir/home
          sudo chmod 1777 chroot_dir/tmp

      - name: Compress System Core into SquashFS
        run: |
          # Nén đa luồng hệ thống cốt lõi siêu tốc chỉ trong 30 giây vì dung lượng siêu nhẹ
          sudo mksquashfs chroot_dir image/live/filesystem.squashfs -comp xz -processors $(nproc)

      - name: Extract Kernel and Setup GRUB Bootloader
        run: |
          # Trích xuất nhân boot Linux nguyên bản đang chạy ổn định của máy chủ vào phân vùng đĩa ISO
          sudo cp /boot/vmlinuz-$(uname -r) image/live/vmlinuz
          sudo cp /boot/initrd.img-$(uname -r) image/live/initrd.img
          
          mkdir -p image/boot/grub
          cat <<'EOF' > image/boot/grub/grub.cfg
          set timeout=5
          set default=0
          
          menuentry "Boot DuyKhanhOS Live Suite" {
              linux /live/vmlinuz boot=casper quiet splash
              initrd /live/initrd.img
          }
          EOF

      - name: Generate Production Bootable ISO
        run: |
          # Đúc file đĩa ISO thành phẩm hoàn chỉnh 
          grub-mkrescue -o duykhanhos-production.iso image

      - name: Upload Finished System ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duykhanh-os-production-iso
          path: duykhanhos-production.iso
