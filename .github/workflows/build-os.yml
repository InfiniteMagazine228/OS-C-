name: Build C++ OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-i686-linux-gnu g++-i686-linux-gnu \
                                 grub-pc-bin xorriso mtools

      - name: Compile Assembly and C++
        run: |
          # Biên dịch file assembly (.s)
          i686-linux-gnu-as boot.s -o boot.o
          
          # Biên dịch file C++ với các cờ tắt thư viện chuẩn (freestanding)
          i686-linux-gnu-g++ -c kernel.cpp -o kernel.o -ffreestanding -O2 -Wall -Wextra -fno-exceptions -fno-rtti
          
          # Liên kết tạo file kernel nhị phân .bin
          i686-linux-gnu-gcc -T linker.ld -o myos.bin -ffreestanding -O2 -nostdlib boot.o kernel.o -lgcc

      - name: Prepare ISO Directory Structure
        run: |
          mkdir -p isodir/boot/grub
          cp myos.bin isodir/boot/myos.bin
          cp grub.cfg isodir/boot/grub/grub.cfg

      - name: Generate Bootable ISO
        run: |
          grub-mkrescue -o myos.iso isodir

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-cpp-os-iso
          path: myos.iso
