name: Build DuyKhanhOS Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ISO Generation Tools on Host
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin mtools dosfstools wget

      - name: Extract System Core via Pure Alpine
        run: |
          sudo rm -rf chroot_dir image duykhanhos-production.iso
          mkdir -p chroot_dir
          
          # ĐỔI NHÂN SANG ALPINE: Triệt tiêu vĩnh viễn 100% lỗi nắn dòng mạng và lỗi 404 của Ubuntu Pro
          docker create --name duykhanh_core alpine:latest
          docker export duykhanh_core | tar -C chroot_dir -xf -
          docker rm duykhanh_core

      - name: Force Static Asian Package Repositories
        run: |
          # Thiết lập kho ứng dụng tĩnh chính thức không bảo mật qua máy chủ CDN phân phối chuẩn
          sudo mkdir -p chroot_dir/etc/apk
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/apk/repositories
          http://alpinelinux.org
          http://alpinelinux.org
          EOF

      - name: Synchronize Network DNS
        run: |
          sudo cp /etc/resolv.conf chroot_dir/etc/resolv.conf

      - name: Fix Dev Null, Tmp Permission and Mount System
        run: |
          sudo rm -f chroot_dir/dev/null
          sudo mknod -m 666 chroot_dir/dev/null c 1 3
          
          sudo mkdir -p chroot_dir/tmp
          sudo chmod 1777 chroot_dir/tmp
          
          sudo mount --bind /dev chroot_dir/dev
          sudo mount --bind /proc chroot_dir/proc
          sudo mount --bind /sys chroot_dir/sys

      - name: Install Graphic Suite and APK Package Manager Core
        run: |
          # Cập nhật danh sách và cài đặt môi trường đồ họa bằng lệnh apk siêu tốc không nắn dòng
          sudo chroot chroot_dir apk update
          
          # Cài đặt nhân Linux, giao diện XFCE, thanh Dock Plank, chuột/bàn phím và bộ lệnh apk
          sudo chroot chroot_dir apk add --no-cache \
            linux-virt alpine-base xorg-server xfce4 xfce4-terminal lightdm plank \
            networkmanager networkmanager-cli networkmanager-tui thunar mousepad git vlc \
            firefox chromium gparted bash sudo

      - name: Unmount System Filesystems
        if: always()
        run: |
          sudo umount -l chroot_dir/dev || true
          sudo umount -l chroot_dir/proc || true
          sudo umount -l chroot_dir/sys || true

      - name: Configure Auto-Login and User Account
        run: |
          sudo mkdir -p chroot_dir/etc/lightdm/lightdm.conf.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/lightdm/lightdm.conf.d/autologin.conf
          [Seat:*]
          autologin-user=duykhanh
          autologin-user-timeout=0
          user-session=xfce
          EOF

          # Tạo tài khoản duykhanh và cấp quyền admin tối cao
          sudo chroot chroot_dir adduser -D -s /bin/bash duykhanh || true
          sudo chroot chroot_dir addgroup duykhanh wheel || true
          
          sudo mkdir -p chroot_dir/etc/sudoers.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/sudoers.d/g_sudo
          %wheel ALL=(ALL:ALL) NOPASSWD: ALL
          EOF
          sudo chmod 0440 chroot_dir/etc/sudoers.d/g_sudo

      - name: Setup System AutoStart Configuration
        run: |
          sudo mkdir -p chroot_dir/home/duykhanh/.config/autostart
          
          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/plank.desktop
          [Desktop Entry]
          Type=Application
          Exec=plank
          Name=Plank Dock
          X-GNOME-Autostart-enabled=true
          EOF

          sudo chown -R 1000:1000 chroot_dir/home/duykhanh

      - name: Compress Filesystem into SquashFS
        run: |
          mkdir -p image/live
          # Nhân Alpine siêu gọn nhẹ giúp thời gian nén đĩa hoàn tất chỉ trong 2 phút
          sudo mksquashfs chroot_dir image/live/filesystem.squashfs -comp xz -processors $(nproc)

      - name: Extract Kernel and Setup GRUB Bootloader
        run: |
          sudo cp chroot_dir/boot/vmlinuz-virt image/live/vmlinuz || sudo cp chroot_dir/boot/vmlinuz* image/live/vmlinuz
          sudo cp chroot_dir/boot/initramfs-virt image/live/initrd.img || sudo cp chroot_dir/boot/initramfs* image/live/initrd.img
          
          mkdir -p image/boot/grub
          cat <<'EOF' > image/boot/grub/grub.cfg
          set timeout=5
          set default=0
          
          menuentry "Boot DuyKhanhOS Live (APK & Web Ready)" {
              linux /live/vmlinuz alpine_loop root=/dev/shm quiet splash
              initrd /live/initrd.img
          }
          EOF

      - name: Generate Custom Bootable ISO
        run: |
          grub-mkrescue -o duykhanhos-production.iso image

      - name: Upload Finished System ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duykhanh-os-production-iso
          path: duykhanhos-production.iso
