name: Build DuyKhanhOS ISO (XFCE + Plank)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cập nhật hệ thống và cài đặt công cụ cần thiết
      run: |
        sudo apt-get update
        sudo apt-get install -y squashfs-tools xorriso mkisofs wget curl genisoimage git

    - name: Tải ISO Xubuntu gốc làm nền tảng (XFCE mặc định)
      run: |
        mkdir -p env/iso env/iso_new env/squashfs env/filesystem
        wget http://ubuntu.com -O env/xubuntu.iso

    - name: Xả nén file ISO gốc
      run: |
        sudo mount -o loop env/xubuntu.iso env/iso
        cp -a env/iso/. env/iso_new/
        sudo umount env/iso

    - name: Xả nén hệ thống tệp tin (SquashFS)
      run: |
        sudo unsquashfs -d env/filesystem env/iso_new/casper/filesystem.squashfs

    - name: Tùy biến hệ thống (Cài đặt Bluetooth, Wifi, Chrome, Unikey, Đồ họa macOS/RedStar)
      run: |
        sudo cp /etc/resolv.conf env/filesystem/etc/resolv.conf
        
        sudo chroot env/filesystem /bin/bash << 'EOF'
        apt-get update
        
        # 1. Cài đặt các gói hỗ trợ phần cứng & Tiện ích kết nối
        apt-get install -y network-manager bluez bluez-tools pulseaudio bluetooth
        
        # 2. Cài đặt môi trường đồ họa đồ họa bổ sung và Thanh Dock Plank
        apt-get install -y xfce4 xfce4-goodies plank
        
        # 3. Cài đặt bộ gõ tiếng Việt Unikey
        apt-get install -y ibus ibus-unikey
        echo "export GTK_IM_MODULE=ibus" >> /etc/profile
        echo "export QT_IM_MODULE=ibus" >> /etc/profile
        echo "export XMODIFIERS=@im=ibus" >> /etc/profile
        
        # 4. Cài đặt Google Chrome
        wget https://google.com
        apt-get install -y ./google-chrome-stable_current_amd64.deb
        rm google-chrome-stable_current_amd64.deb
        
        # 5. Cấu hình giao diện macOS / RedStar tối giản cho XFCE và Plank
        # Tạo thư mục chứa theme hệ thống
        mkdir -p /usr/share/themes /usr/share/icons /etc/skel/.config/plank/dock1
        mkdir -p /etc/skel/.config/autostart
        
        # Tải WhiteSur GTK Theme (Phong cách macOS tối giản rất hợp với RedStar)
        git clone https://github.com /tmp/WhiteSur
        cd /tmp/WhiteSur && ./install.sh -d /usr/share/themes
        
        # Tải bộ Icon phong cách Apple/macOS phẳng
        git clone https://github.com /tmp/WhiteSur-Icons
        cd /tmp/WhiteSur-Icons && ./install.sh -d /usr/share/icons
        
        # Cấu hình XFCE mặc định sử dụng Theme và Icon mới cho user khi khởi động
        mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
        
        # Ép buộc XFCE load giao diện WhiteSur-Dark
        echo '<?xml version="1.0" encoding="UTF-8"?><channel name="xsettings" version="1.0"><property name="Net" type="empty"><property name="ThemeName" type="string" value="WhiteSur-Dark"/><property name="IconThemeName" type="string" value="WhiteSur-dark"/></property></channel>' > /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
        
        # Tự động kích hoạt Plank Dock ở cạnh dưới màn hình khi vào OS
        cat << 'INNER_EOF' > /etc/skel/.config/autostart/plank.desktop
        [Desktop Entry]
        Type=Application
        Exec=plank
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Plank Dock
        INNER_EOF
        
        # 6. Cấu hình Auto-Login thẳng vào màn hình làm việc không cần mật khẩu
        mkdir -p /etc/lightdm/lightdm.conf.d/
        cat << 'INNER_EOF' > /etc/lightdm/lightdm.conf.d/custom.conf
        [Seat:*]
        autologin-guest=false
        autologin-user=xubuntu
        autologin-user-timeout=0
        INNER_EOF
        
        # 7. Thay đổi nhận diện thương hiệu thành DuyKhanhOS
        sed -i 's/Xubuntu/DuyKhanhOS/g' /etc/hosts /etc/hostname || true
        echo "DuyKhanhOS Live v1.0" > /etc/issue
        
        # Dọn dẹp hệ thống để tối ưu dung lượng ISO
        apt-get clean
        rm -rf /tmp/* ~/.bash_history
        EOF

    - name: Đóng gói lại hệ thống tệp tin SquashFS
      run: |
        sudo rm env/iso_new/casper/filesystem.squashfs
        sudo mksquashfs env/filesystem env/iso_new/casper/filesystem.squashfs -comp xz

    - name: Đổi tên hiển thị trên Menu Boot sang DuyKhanhOS
      run: |
        sudo find env/iso_new/boot/ -type f -exec sed -i 's/Xubuntu/DuyKhanhOS/g' {} + || true
        sudo find env/iso_new/isolinux/ -type f -exec sed -i 's/Xubuntu/DuyKhanhOS/g' {} + || true

    - name: Tạo file ISO DuyKhanhOS hoàn chỉnh
      run: |
        cd env/iso_new
        sudo xorriso -as mkisofs -r -V "DuyKhanhOS" \
          -o ../DuyKhanhOS.iso \
          -J -joliet-long -b isolinux/isolinux.bin \
          -c isolinux/boot.cat -no-emul-boot \
          -boot-load-size 4 -boot-info-table \
          -eltorito-alt-boot -e boot/grub/efi.img \
          -no-emul-boot .

    - name: Tải file ISO lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DuyKhanhOS-ISO
        path: env/DuyKhanhOS.iso
