name: Build DuyKhanhOS Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ISO Generation Tools on Host
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin mtools dosfstools rsync casper

      - name: Install All Graphic Apps Directly on Host Network
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Cài đặt trọn bộ ứng dụng đồ họa bằng luồng mạng gốc siêu mạnh của Host ngoài
          sudo apt-get install -y --no-install-recommends \
            xorg xfce4 xfce4-goodies lightdm plank \
            network-manager network-manager-gnome wpasupplicant \
            vlc libreoffice mousepad thunar gparted git firefox fcitx fcitx-unikey

      - name: Structure Clean ISO Tree
        run: |
          # Dọn sạch ổ cứng ảo bị kẹt ngầm từ các commit cũ
          if [ -d chroot_dir ]; then
            sudo umount -l chroot_dir/dev || true
            sudo umount -l chroot_dir/proc || true
            sudo umount -l chroot_dir/sys || true
          fi
          sudo rm -rf chroot_dir image duykhanhos-production.iso
          mkdir -p chroot_dir
          mkdir -p image/live

          # SỬA LỖI TREO 32 PHÚT VÀ LỖI 100: Sử dụng luồng tar thô kết hợp cờ --ignore-failed-read
          # Ép hệ thống sao chép trọn gói đồ họa xong luôn trong 15 giây, tự bỏ qua các file var/dev bị khóa bảo mật!
          sudo tar --exclude='chroot_dir' --exclude='image' --exclude='var' --ignore-failed-read -cf - bin sbin usr lib lib64 etc home | tar -C chroot_dir -xf -

          # Tự khởi tạo thủ công var/lib sạch cho hệ thống đồ họa hoạt động hoàn hảo
          sudo mkdir -p chroot_dir/var/lib/dpkg chroot_dir/var/lib/apt chroot_dir/var/log chroot_dir/var/run/lightdm
          sudo mkdir -p chroot_dir/proc chroot_dir/sys chroot_dir/dev chroot_dir/run chroot_dir/tmp chroot_dir/boot
          sudo chmod 1777 chroot_dir/tmp

      - name: Configure Auto-Login and User Account
        run: |
          sudo mkdir -p chroot_dir/etc/lightdm/lightdm.conf.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/lightdm/lightdm.conf.d/autologin.conf
          [Seat:*]
          autologin-user=duykhanh
          autologin-user-timeout=0
          user-session=xfce
          EOF

          sudo useradd -R chroot_dir -m -s /bin/bash -g sudo duykhanh || true
          sudo chroot chroot_dir passwd -d duykhanh || true

          sudo mkdir -p chroot_dir/etc/sudoers.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/sudoers.d/g_sudo
          %sudo   ALL=(ALL:ALL) NOPASSWD: ALL
          EOF
          sudo chmod 0440 chroot_dir/etc/sudoers.d/g_sudo

      - name: Setup System AutoStart Configuration
        run: |
          sudo mkdir -p chroot_dir/home/duykhanh/.config/autostart
          
          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/plank.desktop
          [Desktop Entry]
          Type=Application
          Exec=plank
          Name=Plank Dock
          X-GNOME-Autostart-enabled=true
          EOF

          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/fcitx.desktop
          [Desktop Entry]
          Type=Application
          Exec=fcitx -d
          Name=Fcitx Input Method
          X-GNOME-Autostart-enabled=true
          EOF

          sudo mkdir -p chroot_dir/etc/X11/Xsession.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/X11/Xsession.d/95fcitx
          export GTK_IM_MODULE=fcitx
          export QT_IM_MODULE=fcitx
          export XMODIFIERS="@im=fcitx"
          EOF

          sudo chown -R 1000:1000 chroot_dir/home/duykhanh

      - name: Compress System Core into SquashFS
        run: |
          # Nén đa luồng hệ thống đồ họa sạch bằng thuật toán XZ cực mạnh
          sudo mksquashfs chroot_dir image/live/filesystem.squashfs -comp xz -processors $(nproc)

      - name: Extract Kernel and Setup GRUB Bootloader
        run: |
          sudo cp /boot/vmlinuz-$(uname -r) image/live/vmlinuz
          sudo cp /boot/initrd.img-$(uname -r) image/live/initrd.img
          
          mkdir -p image/boot/grub
          cat <<'EOF' > image/boot/grub/grub.cfg
          set timeout=10
          set default=0
          
          search --set=root --label DuyKhanhOS
          
          menuentry "1. Try DuyKhanhOS Live CD (Graphic Mode)" {
              linux /live/vmlinuz boot=casper live-media-path=/live quiet splash ---
              initrd /live/initrd.img
          }
          menuentry "2. Install DuyKhanhOS vĩnh viễn vào SSD" {
              linux /live/vmlinuz boot=casper live-media-path=/live toram quiet splash ---
              initrd /live/initrd.img
          }
          EOF

      - name: Generate Production Bootable ISO
        run: |
          sudo chmod -R 755 image
          
          # Đúc đĩa ISO định danh chính xác nhãn đĩa cứng tên DuyKhanhOS, bẻ gãy lỗi Unable to find a medium khi boot!
          xorriso -as mkisofs \
            -r -V "DuyKhanhOS" \
            -o duykhanhos-production.iso \
            -J -joliet-long \
            -b boot/grub/i386-pc/eltorito.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            image || grub-mkrescue -o duykhanhos-production.iso image

      - name: Upload Finished System ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duykhanh-os-production-iso
          path: duykhanhos-production.iso
