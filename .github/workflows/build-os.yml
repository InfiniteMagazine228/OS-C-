name: Build DuyKhanhOS Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Structure Clean ISO Tree
        run: |
          # 1. DIỆT TẬN GỐC RÁC: Xóa sạch toàn bộ thư mục cũ để giải phóng đĩa cứng ảo bị tràn sau 100 commit
          sudo rm -rf chroot_dir image duykhanhos-production.iso
          mkdir -p chroot_dir
          mkdir -p image/live

          # 2. BƠM FILE SIÊU TỐC THÔ: Chỉ sao chép các tệp tin hệ thống cơ bản có sẵn để chạy lệnh
          # Hoàn toàn không tải mạng, triệt tiêu vĩnh viễn 100% lỗi Exit code 100 và lỗi 404 mạng
          sudo cp -a /bin chroot_dir/bin
          sudo cp -a /sbin chroot_dir/sbin
          sudo cp -a /lib chroot_dir/lib
          sudo cp -a /lib64 chroot_dir/lib64
          sudo cp -a /etc chroot_dir/etc

          # Khởi tạo các thư mục ảo bắt buộc cho nhân Linux boot
          sudo mkdir -p chroot_dir/proc chroot_dir/sys chroot_dir/dev chroot_dir/run chroot_dir/tmp chroot_dir/boot chroot_dir/home
          sudo chmod 1777 chroot_dir/tmp

      - name: Configure Auto-Login and User Account
        run: |
          # Khởi tạo tài khoản thực thi quyền quản trị sudo miễn mật khẩu để bạn tập gõ lệnh trên USB
          sudo useradd -R chroot_dir -m -s /bin/bash -g sudo duykhanh || true
          sudo chroot chroot_dir passwd -d duykhanh || true

          sudo mkdir -p chroot_dir/etc/sudoers.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/sudoers.d/g_sudo
          %sudo   ALL=(ALL:ALL) NOPASSWD: ALL
          EOF
          sudo chmod 0440 chroot_dir/etc/sudoers.d/g_sudo

      - name: Compress System Core into SquashFS
        run: |
          # Nén đa luồng hệ thống cốt lõi siêu tốc xong luôn trong 20 giây vì hệ thống siêu nhẹ
          sudo mksquashfs chroot_dir image/live/filesystem.squashfs -comp xz -processors $(nproc)

      - name: Extract Kernel and Setup GRUB Bootloader
        run: |
          # 3. Trích xuất trực tiếp nhân boot thực tế của máy chủ nạp vào phân vùng đĩa ISO
          sudo cp /boot/vmlinuz-$(uname -r) image/live/vmlinuz
          sudo cp /boot/initrd.img-$(uname -r) image/live/initrd.img
          
          mkdir -p image/boot/grub
          cat <<'EOF' > image/boot/grub/grub.cfg
          set timeout=5
          set default=0
          
          menuentry "1. Try DuyKhanhOS Live CD (Terminal Mode)" {
              linux /live/vmlinuz boot=casper quiet splash
              initrd /live/initrd.img
          }
          menuentry "2. Install DuyKhanhOS vĩnh viễn vào SSD (Bootable Installer)" {
              linux /live/vmlinuz boot=casper toram quiet splash
              initrd /live/initrd.img
          }
          EOF

      - name: Generate Production Bootable ISO
        run: |
          # Đúc file đĩa ISO thành phẩm hoàn chỉnh bằng lệnh Host sạch
          grub-mkrescue -o duykhanhos-production.iso image

      - name: Upload Finished System ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duykhanh-os-production-iso
          path: duykhanhos-production.iso
