name: Build DuyKhanhOS Custom XFCE Full Features

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cập nhật hệ thống và cài đặt công cụ cần thiết
      run: |
        sudo apt-get update
        sudo apt-get install -y squashfs-tools xorriso mkisofs wget curl genisoimage git syslinux-common

    - name: Tải ISO Xubuntu gốc làm nền tảng (XFCE 64-bit)
      run: |
        mkdir -p env/iso env/iso_new env/squashfs env/filesystem
        wget http://ubuntu.com -O env/xubuntu.iso

    - name: Xả nén file ISO gốc
      run: |
        sudo mount -o loop env/xubuntu.iso env/iso
        cp -a env/iso/. env/iso_new/
        sudo umount env/iso

    - name: Xả nén hệ thống tệp tin (SquashFS)
      run: |
        sudo unsquashfs -d env/filesystem env/iso_new/casper/filesystem.squashfs

    - name: Tải trước Giao diện và Icon (Tránh rác phát sinh trong chroot)
      run: |
        mkdir -p themes icons
        git clone https://github.com themes/WhiteSur
        git clone https://github.com icons/WhiteSur-Icons
        
        # Tạo sẵn cấu trúc thư mục đích trong OS tùy biến
        sudo mkdir -p env/filesystem/usr/share/themes env/filesystem/usr/share/icons
        sudo mkdir -p env/filesystem/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
        sudo mkdir -p env/filesystem/etc/skel/Desktop
        sudo mkdir -p env/filesystem/etc/skel/.config/autostart
        sudo mkdir -p env/filesystem/etc/lightdm/lightdm.conf.d/
        sudo mkdir -p env/filesystem/etc/calamares/modules

    - name: Tùy biến hệ thống chuyên sâu (Sửa lỗi cài đặt Calamares)
      run: |
        sudo mount --bind /dev env/filesystem/dev
        sudo mount --bind /dev/pts env/filesystem/dev/pts
        sudo mount --bind /proc env/filesystem/proc
        sudo mount --bind /sys env/filesystem/sys
        sudo cp /etc/resolv.conf env/filesystem/etc/resolv.conf
        
        sudo chroot env/filesystem /bin/bash << 'EOF'
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        
        # Ép buộc ghi đè khi cài đặt cấu hình Calamares Ubuntu để tránh lỗi trùng lặp
        apt-get install -y -o Dpkg::Options::="--force-overwrite" calamares calamares-settings-ubuntu
        
        # Cài đặt các ứng dụng cần thiết
        apt-get install -y network-manager network-manager-gnome nm-tray
        apt-get install -y bluez bluez-tools pulseaudio bluetooth
        apt-get install -y firefox vlc libreoffice mousepad git xfce4 xfce4-goodies plank
        
        # Cài đặt bộ gõ tiếng Việt Fcitx-Unikey
        apt-get install -y fcitx fcitx-unikey fcitx-config-gtk
        echo "export GTK_IM_MODULE=fcitx" >> /etc/profile
        echo "export QT_IM_MODULE=fcitx" >> /etc/profile
        echo "export XMODIFIERS=@im=fcitx" >> /etc/profile
        
        # Đổi màn hình khởi động Plymouth thành chữ DuyKhanhOS
        apt-get install -y plymouth-themes
        sed -i 's/text/DuyKhanhOS/g' /usr/share/plymouth/themes/ubuntu-text/ubuntu-text.plymouth || true
        update-initramfs -u -k all
        
        # Cấu hình Swap ảo tự động 2GB khi Boot phục vụ máy cấu hình yếu
        cat << 'INNER_EOF' > /etc/init.d/setup-swap
        #!/bin/bash
        if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
        fi
        INNER_EOF
        chmod +x /etc/init.d/setup-swap
        update-rc.d setup-swap defaults
        
        # Đổi nhận diện tên thương hiệu DuyKhanhOS
        sed -i 's/Xubuntu/DuyKhanhOS/g' /etc/hosts /etc/hostname || true
        echo "DuyKhanhOS Live v1.0" > /etc/issue
        
        # Dọn dẹp sạch sẽ APT cache
        apt-get clean
        rm -rf /tmp/* ~/.bash_history
        EOF

        # Gỡ mount hệ thống ảo ngay lập tức một cách an toàn
        sudo umount -l env/filesystem/dev/pts || true
        sudo umount -l env/filesystem/dev || true
        sudo umount -l env/filesystem/proc || true
        sudo umount -l env/filesystem/sys || true

    - name: Chép cấu hình giao diện & Tệp cấu hình vào hệ thống
      run: |
        # Chép theme đồ họa vào hệ thống
        cd themes/WhiteSur && sudo ./install.sh -d ../../env/filesystem/usr/share/themes && cd ../..
        cd icons/WhiteSur-Icons && sudo ./install.sh -d ../../env/filesystem/usr/share/icons && cd ../..
        
        # Tạo tệp cấu hình XFCE Mac layout
        echo '<?xml version="1.0" encoding="UTF-8"?><channel name="xsettings" version="1.0"><property name="Net" type="empty"><property name="ThemeName" type="string" value="WhiteSur-Dark"/><property name="IconThemeName" type="string" value="WhiteSur-dark"/></property></channel>' | sudo tee env/filesystem/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
        
        # Tạo shortcut Calamares ngoài màn hình
        echo -e "[Desktop Entry]\nType=Application\nVersion=1.0\nName=Cài Đặt DuyKhanhOS To SSD\nComment=Cài đặt vĩnh viễn hệ điều hành vào bộ nhớ máy tính\nExec=sudo calamares\nIcon=install\nTerminal=false\nCategories=System;" | sudo tee env/filesystem/etc/skel/Desktop/calamares.desktop
        sudo chmod +x env/filesystem/etc/skel/Desktop/calamares.desktop

        # Tự động kích hoạt các ứng dụng nền khi khởi động Live CD
        echo -e "[Desktop Entry]\nType=Application\nExec=fcitx -d\nHidden=false\nNoDisplay=false\nX-GNOME-Autostart-enabled=true\nName=Fcitx" | sudo tee env/filesystem/etc/skel/.config/autostart/fcitx.desktop
        echo -e "[Desktop Entry]\nType=Application\nExec=plank\nHidden=false\nNoDisplay=false\nX-GNOME-Autostart-enabled=true\nName=Plank" | sudo tee env/filesystem/etc/skel/.config/autostart/plank.desktop
        echo -e "[Desktop Entry]\nType=Application\nExec=nm-tray\nHidden=false\nNoDisplay=false\nX-GNOME-Autostart-enabled=true\nName=Network" | sudo tee env/filesystem/etc/skel/.config/autostart/nm-tray.desktop
        
        # Tự động thông báo rút USB khi cài xong trên Calamares
        echo -e "---\nrestartNowEnabled: true\nrestartNowChecked: true\nrebootCommand: \"systemctl reboot\"" | sudo tee env/filesystem/etc/calamares/modules/finished.conf
        
        # Cấu hình Auto-Login tự động đăng nhập thẳng vào Desktop không đòi mật khẩu
        echo -e "[Seat:*]\nautologin-guest=false\navatars-low-res=true\nautologin-user=xubuntu\nautologin-user-timeout=0" | sudo tee env/filesystem/etc/lightdm/lightdm.conf.d/custom.conf

    - name: Đóng gói hệ thống (SỬA LỖI EXIT CODE 32)
      run: |
        sudo rm -f env/iso_new/casper/filesystem.squashfs
        # Dọn sạch các thư mục động có nguy cơ gây kẹt khóa tiến trình (lỗi 32)
        sudo rm -rf env/filesystem/tmp/* env/filesystem/var/tmp/* env/filesystem/run/* env/filesystem/root/.bash_history
        
        # SỬA LỖI 32: Dùng lệnh loại trừ các phân vùng hệ thống ảo thông qua cờ -e và kích hoạt -wildcards
        sudo mksquashfs env/filesystem env/iso_new/casper/filesystem.squashfs \
          -comp xz -b 1M -T 0 -fstime now -wildcards \
          -e "dev/*" -e "proc/*" -e "sys/*" -e "run/*" -e "tmp/*" -e "var/tmp/*"

    - name: CẤU HÌNH LIVE CD & BOOTABLE MENU (Hỗ trợ UEFI + BIOS/Legacy)
      run: |
        sudo find env/iso_new/boot/ -type f -exec sed -i 's/Xubuntu/DuyKhanhOS/g' {} + || true
        sudo find env/iso_new/isolinux/ -type f -exec sed -i 's/Xubuntu/DuyKhanhOS/g' {} + || true
        
        mkdir -p env/iso_new/boot/grub
        cat << 'EOF' | sudo tee env/iso_new/boot/grub/grub.cfg
        set timeout=10
        set default=0
        
        menuentry "DuyKhanhOS v1.0 (Live CD Mode - Run from RAM)" {
            set gfxpayload=keep
            linux /casper/vmlinuz boot=casper file=/cdrom/preseed/xubuntu.seed quiet splash ---
            initrd /casper/initrd
        }
        
        menuentry "Install DuyKhanhOS To SSD (Calamares Mode)" {
            set gfxpayload=keep
            linux /casper/vmlinuz boot=casper file=/cdrom/preseed/xubuntu.seed quiet splash ---
            initrd /casper/initrd
        }
        EOF

    - name: Đóng gói thành file ISO Hybrid Bootable
      run: |
        cd env/iso_new
        sudo xorriso -as mkisofs -r -V "DuyKhanhOS" \
          -o ../DuyKhanhOS.iso \
          -J -joliet-long \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -eltorito-alt-boot \
          -e boot/grub/efi.img -no-emul-boot \
          -isohybrid-gpt-basdat .

    - name: Tải file ISO lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DuyKhanhOS-ISO
        path: env/DuyKhanhOS.iso
