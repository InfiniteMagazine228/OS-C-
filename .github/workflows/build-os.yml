name: Build DuyKhanhOS Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pure Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso \
                                 grub-pc-bin mtools dosfstools

      - name: Bootstrap Root Filesystem
        run: |
          # Khởi tạo một hệ thống Linux sạch không phụ thuộc vào live-build sandbox
          sudo debootstrap --variant=minbase noble chroot_dir http://ubuntu.com

      - name: Install Applications Inside OS
        run: |
          # Chroot vào hệ thống vừa tạo để tự động tải các gói ứng dụng quan trọng
          sudo chroot chroot_dir apt-get update
          sudo chroot chroot_dir apt-get install -y --no-install-recommends \
            linux-image-generic xorg xfce4 xfce4-goodies lightdm plank \
            network-manager network-manager-gnome wpasupplicant chromium-browser \
            fcitx fcitx-unikey fcitx-config-gtk vlc libreoffice mousepad thunar \
            calamares calamares-settings-ubuntu

      - name: Setup System AutoStart Configuration
        run: |
          # Cấu hình tự động bật bộ gõ Unikey và thanh Dock Mac khi khởi động
          sudo mkdir -p chroot_dir/etc/skel/.config/autostart
          
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/skel/.config/autostart/plank.desktop
          [Desktop Entry]
          Type=Application
          Exec=plank
          Name=Plank Dock
          X-GNOME-Autostart-enabled=true
          EOF

          sudo cat <<'EOF' | sudo tee chroot_dir/etc/skel/.config/autostart/fcitx.desktop
          [Desktop Entry]
          Type=Application
          Exec=fcitx -d
          Name=Fcitx Input Method
          X-GNOME-Autostart-enabled=true
          EOF

          sudo mkdir -p chroot_dir/etc/X11/Xsession.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/X11/Xsession.d/95fcitx
          export GTK_IM_MODULE=fcitx
          export QT_IM_MODULE=fcitx
          export XMODIFIERS="@im=fcitx"
          EOF

      - name: Compress Filesystem into SquashFS
        run: |
          # Đóng gói toàn bộ hệ điều hành thành một file duy nhất
          mkdir -p image/live
          sudo mksquashfs chroot_dir image/live/filesystem.squashfs -comp xz

      - name: Extract Kernel and Setup GRUB
        run: |
          # Lấy nhân Linux ra ngoài phân vùng boot của đĩa ISO
          cp chroot_dir/boot/vmlinuz* image/live/vmlinuz
          cp chroot_dir/boot/initrd* image/live/initrd.img
          
          mkdir -p image/boot/grub
          cat <<'EOF' > image/boot/grub/grub.cfg
          set timeout=5
          set default=0
          
          menuentry "Boot DuyKhanhOS Live (Apps & Wi-Fi Ready)" {
              linux /live/vmlinuz boot=live quiet splash
              initrd /live/initrd.img
          }
          menuentry "Direct Install DuyKhanhOS to SSD" {
              linux /live/vmlinuz boot=live calamares quiet splash
              initrd /live/initrd.img
          }
          EOF

      - name: Generate Custom Bootable ISO
        run: |
          # Đóng gói file ISO thủ công, bỏ qua hoàn toàn sandbox lỗi
          grub-mkrescue -o duykhanhos-production.iso image

      - name: Upload Finished System ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duykhanh-os-production-iso
          path: duykhanhos-production.iso
