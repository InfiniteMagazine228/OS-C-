name: Build DuyKhanhOS Custom XFCE Full Features

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cập nhật hệ thống và cài đặt công cụ cần thiết
      run: |
        sudo apt-get update
        sudo apt-get install -y squashfs-tools xorriso mkisofs wget curl genisoimage git syslinux-common

    - name: Tải ISO Xubuntu gốc làm nền tảng (XFCE 64-bit)
      run: |
        mkdir -p env/iso env/iso_new env/squashfs env/filesystem
        wget http://ubuntu.com -O env/xubuntu.iso

    - name: Xả nén file ISO gốc
      run: |
        sudo mount -o loop env/xubuntu.iso env/iso
        cp -a env/iso/. env/iso_new/
        sudo umount env/iso

    - name: Xả nén hệ thống tệp tin (SquashFS)
      run: |
        sudo unsquashfs -d env/filesystem env/iso_new/casper/filesystem.squashfs

    - name: Tùy biến hệ thống chuyên sâu (Swap, Plymouth, Calamares, Wifi)
      run: |
        sudo mount --bind /dev env/filesystem/dev
        sudo mount --bind /dev/pts env/filesystem/dev/pts
        sudo mount --bind /proc env/filesystem/proc
        sudo mount --bind /sys env/filesystem/sys
        sudo cp /etc/resolv.conf env/filesystem/etc/resolv.conf
        
        sudo chroot env/filesystem /bin/bash << 'EOF'
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        
        # 1. CÀI ĐẶT TRÌNH CÀI ĐẶT CALAMARES TO SSD & CÁC ỨNG DỤNG ĐI KÈM
        apt-get install -y calamares calamares-settings-ubuntu network-manager network-manager-gnome nm-tray
        apt-get install -y bluez bluez-tools pulseaudio bluetooth
        apt-get install -y firefox vlc libreoffice mousepad git xfce4 xfce4-goodies plank
        
        # Tạo shortcut cho trình cài đặt Calamares ngoài Desktop
        mkdir -p /etc/skel/Desktop
        cat << 'INNER_EOF' > /etc/skel/Desktop/calamares.desktop
        [Desktop Entry]
        Type=Application
        Version=1.0
        Name=Cài Đặt DuyKhanhOS To SSD
        Comment=Cài đặt vĩnh viễn hệ điều hành vào bộ nhớ máy tính
        Exec=sudo calamares
        Icon=install
        Terminal=false
        Categories=System;
        INNER_EOF
        chmod +x /etc/skel/Desktop/calamares.desktop

        # Tự động tạo thông báo nhắc rút USB khi cài đặt hoàn tất thành công thông qua Calamares
        mkdir -p /etc/calamares/modules
        cat << 'INNER_EOF' > /etc/calamares/modules/finished.conf
        ---
        restartNowEnabled: true
        restartNowChecked: true
        rebootCommand: "systemctl reboot"
        INNER_EOF
        
        # 2. CẤU HÌNH HIỆU NĂNG SIÊU TỐC: TỰ ĐỘNG TẠO SWAP ẢO 2GB KHI BOOT
        cat << 'INNER_EOF' > /etc/init.d/setup-swap
        #!/bin/bash
        if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
        fi
        INNER_EOF
        chmod +x /etc/init.d/setup-swap
        update-rc.d setup-swap defaults

        # 3. THAY ĐỔI MÀN HÌNH KHỞI ĐỘNG PLYMOUTH CÓ CHỮ DUYKHANHOS
        apt-get install -y plymouth-themes
        # Chỉnh sửa cấu hình hiển thị text của Plymouth mặc định sang tên bạn
        sed -i 's/text/DuyKhanhOS/g' /usr/share/plymouth/themes/ubuntu-text/ubuntu-text.plymouth || true
        update-initramfs -u -k all
        
        # 4. CÀI ĐẶT BỘ GÕ TIẾNG VIỆT FCITX-UNIKEY
        apt-get install -y fcitx fcitx-unikey fcitx-config-gtk
        echo "export GTK_IM_MODULE=fcitx" >> /etc/profile
        echo "export QT_IM_MODULE=fcitx" >> /etc/profile
        echo "export XMODIFIERS=@im=fcitx" >> /etc/profile
        
        mkdir -p /etc/skel/.config/autostart
        cat << 'INNER_EOF' > /etc/skel/.config/autostart/fcitx.desktop
        [Desktop Entry]
        Type=Application
        Exec=fcitx -d
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Fcitx Input Method
        INNER_EOF
        
        # 5. CẤU HÌNH GIAO DIỆN HIỆN ĐẠI (MAC LAYOUT + PLANK)
        mkdir -p /usr/share/themes /usr/share/icons
        git clone https://github.com /tmp/WhiteSur
        cd /tmp/WhiteSur && ./install.sh -d /usr/share/themes
        git clone https://github.com /tmp/WhiteSur-Icons
        cd /tmp/WhiteSur-Icons && ./install.sh -d /usr/share/icons
        
        mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
        echo '<?xml version="1.0" encoding="UTF-8"?><channel name="xsettings" version="1.0"><property name="Net" type="empty"><property name="ThemeName" type="string" value="WhiteSur-Dark"/><property name="IconThemeName" type="string" value="WhiteSur-dark"/></property></channel>' > /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
        
        cat << 'INNER_EOF' > /etc/skel/.config/autostart/plank.desktop
        [Desktop Entry]
        Type=Application
        Exec=plank
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Plank Dock
        INNER_EOF

        # Tự động kích hoạt khay hệ thống quản lý mạng trực quan nm-tray
        cat << 'INNER_EOF' > /etc/skel/.config/autostart/nm-tray.desktop
        [Desktop Entry]
        Type=Application
        Exec=nm-tray
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=Network Tray
        INNER_EOF
        
        # 6. CẤU HÌNH AUTO-LOGIN
        mkdir -p /etc/lightdm/lightdm.conf.d/
        cat << 'INNER_EOF' > /etc/lightdm/lightdm.conf.d/custom.conf
        [Seat:*]
        autologin-guest=false
        autologin-user=xubuntu
        autologin-user-timeout=0
        INNER_EOF
        
        # 7. THAY ĐỔI THƯƠNG HIỆU HỆ THỐNG
        sed -i 's/Xubuntu/DuyKhanhOS/g' /etc/hosts /etc/hostname || true
        echo "DuyKhanhOS Live v1.0" > /etc/issue
        
        apt-get clean
        rm -rf /tmp/* ~/.bash_history
        EOF

        sudo umount -l env/filesystem/dev/pts || true
        sudo umount -l env/filesystem/dev || true
        sudo umount -l env/filesystem/proc || true
        sudo umount -l env/filesystem/sys || true

    - name: Đóng gói lại hệ thống tệp tin bằng thuật toán XZ đa luồng
      run: |
        sudo rm env/iso_new/casper/filesystem.squashfs
        sudo rm -rf env/filesystem/tmp/* env/filesystem/root/.bash_history
        sudo mksquashfs env/filesystem env/iso_new/casper/filesystem.squashfs -comp xz -b 1M -T 0

    - name: CẤU HÌNH LIVE CD & BOOTABLE MENU (Hỗ trợ UEFI + BIOS/Legacy)
      run: |
        sudo find env/iso_new/boot/ -type f -exec sed -i 's/Xubuntu/DuyKhanhOS/g' {} + || true
        sudo find env/iso_new/isolinux/ -type f -exec sed -i 's/Xubuntu/DuyKhanhOS/g' {} + || true
        
        mkdir -p env/iso_new/boot/grub
        cat << 'EOF' | sudo tee env/iso_new/boot/grub/grub.cfg
        set timeout=10
        set default=0
        
        menuentry "DuyKhanhOS v1.0 (Live CD Mode - Run from RAM)" {
            set gfxpayload=keep
            linux /casper/vmlinuz boot=casper file=/cdrom/preseed/xubuntu.seed quiet splash ---
            initrd /casper/initrd
        }
        
        menuentry "Install DuyKhanhOS To SSD (Calamares Mode)" {
            set gfxpayload=keep
            linux /casper/vmlinuz boot=casper file=/cdrom/preseed/xubuntu.seed quiet splash ---
            initrd /casper/initrd
        }
        EOF

    - name: Đóng gói thành file ISO Hybrid Bootable (DuyKhanhOS hoàn chỉnh)
      run: |
        cd env/iso_new
        sudo xorriso -as mkisofs -r -V "DuyKhanhOS" \
          -o ../DuyKhanhOS.iso \
          -J -joliet-long \
          -b isolinux/isolinux.bin -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -eltorito-alt-boot \
          -e boot/grub/efi.img -no-emul-boot \
          -isohybrid-gpt-basdat .

    - name: Tải file ISO lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DuyKhanhOS-ISO
        path: env/DuyKhanhOS.iso
