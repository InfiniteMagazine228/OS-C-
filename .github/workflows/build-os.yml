name: Build DuyKhanhOS Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ISO Generation Tools on Host
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin mtools dosfstools curl git rsync

      - name: Configure and Install All Apps Directly on Host
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Tải toàn bộ môi trường đồ họa Mac-RedStar, bộ gõ Unikey và các phần mềm bạn yêu cầu trực tiếp lên Host ngoài
          sudo apt-get install -y --no-install-recommends \
            casper xorg xfce4 xfce4-goodies lightdm plank \
            network-manager network-manager-gnome wpasupplicant \
            vlc libreoffice mousepad thunar gparted \
            calamares calamares-settings-ubuntu-common calamares-settings-lubuntu

      - name: Install Steam From Official Ubuntu Multiverse
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends steam

      - name: Structure Live ISO System Files
        run: |
          # Khởi tạo thư mục gốc mới tinh
          sudo rm -rf chroot_dir
          mkdir -p chroot_dir
          mkdir -p image/live
          
          # TỐI ƯU TỐC ĐỘ 100%: Chỉ sao chép các thư mục chạy ứng dụng cốt lõi, bỏ qua toàn bộ file rác hệ thống của GitHub
          # Lệnh này sẽ giúp bước này chạy xong chỉ trong vòng 30 giây thay vì bị treo vài chục phút
          for dir in bin sbin usr lib lib64 etc home var; do
            if [ -d /$dir ]; then
              sudo rsync -a /$dir/ chroot_dir/$dir/
            fi
          done

          # Xóa sạch bộ nhớ đệm APT rác để thu nhỏ file ISO tối đa
          sudo rm -rf chroot_dir/var/cache/apt/archives/*
          sudo rm -rf chroot_dir/var/lib/apt/lists/*

          # Tạo lại các thư mục ảo bắt buộc cho nhân Linux khởi động
          sudo mkdir -p chroot_dir/proc chroot_dir/sys chroot_dir/dev chroot_dir/run chroot_dir/tmp chroot_dir/boot
          sudo chmod 1777 chroot_dir/tmp

      - name: Configure Auto-Login and User Account
        run: |
          sudo mkdir -p chroot_dir/etc/lightdm/lightdm.conf.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/lightdm/lightdm.conf.d/autologin.conf
          [Seat:*]
          autologin-user=duykhanh
          autologin-user-timeout=0
          user-session=xfce
          EOF

          sudo useradd -R chroot_dir -m -s /bin/bash -g sudo duykhanh || true
          sudo chroot chroot_dir passwd -d duykhanh || true

          sudo mkdir -p chroot_dir/etc/sudoers.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/sudoers.d/g_sudo
          %sudo   ALL=(ALL:ALL) NOPASSWD: ALL
          EOF
          sudo chmod 0440 chroot_dir/etc/sudoers.d/g_sudo

      - name: Setup System AutoStart Configuration
        run: |
          sudo mkdir -p chroot_dir/home/duykhanh/.config/autostart
          
          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/plank.desktop
          [Desktop Entry]
          Type=Application
          Exec=plank
          Name=Plank Dock
          X-GNOME-Autostart-enabled=true
          EOF

          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/fcitx.desktop
          [Desktop Entry]
          Type=Application
          Exec=fcitx -d
          Name=Fcitx Input Method
          X-GNOME-Autostart-enabled=true
          EOF

          sudo mkdir -p chroot_dir/etc/X11/Xsession.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/X11/Xsession.d/95fcitx
          export GTK_IM_MODULE=fcitx
          export QT_IM_MODULE=fcitx
          export XMODIFIERS="@im=fcitx"
          EOF

          sudo chown -R 1000:1000 chroot_dir/home/duykhanh

      - name: Compress System into SquashFS
        run: |
          # Tiến hành nén đa luồng bằng thuật toán XZ cực mạnh giúp thu nhỏ tối đa dung lượng ISO
          sudo mksquashfs chroot_dir image/live/filesystem.squashfs -comp xz -processors $(nproc)

      - name: Extract Kernel and Setup GRUB Bootloader
        run: |
          # Sao chép nhân Linux thực tế của Host vào phân vùng boot Live ISO
          sudo cp /boot/vmlinuz-$(uname -r) image/live/vmlinuz
          sudo cp /boot/initrd.img-$(uname -r) image/live/initrd.img
          
          mkdir -p image/boot/grub
          cat <<'EOF' > image/boot/grub/grub.cfg
          set timeout=5
          set default=0
          
          menuentry "Boot DuyKhanhOS Live (Auto-Login Mode)" {
              linux /live/vmlinuz boot=casper quiet splash
              initrd /live/initrd.img
          }
          menuentry "Direct Install DuyKhanhOS to SSD" {
              linux /live/vmlinuz boot=casper calamares quiet splash
              initrd /live/initrd.img
          }
          EOF

      - name: Generate Production Bootable ISO
        run: |
          grub-mkrescue -o duykhanhos-production.iso image

      - name: Upload Finished System ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duykhanh-os-production-iso
          path: duykhanhos-production.iso
