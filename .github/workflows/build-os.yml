name: Build DuyKhanhOS Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pure Host Construction Tools
        run: |
          sudo apt-get update
          # Cài đặt công cụ tạo đĩa và debian-archive-keyring chính thức nếu có sẵn trên host
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin mtools dosfstools wget \
                                 debootstrap systemd-sysv debian-archive-keyring || true

      - name: Bootstrap System Core From Host Network
        run: |
          mkdir -p chroot_dir
          
          # TỰ ĐỘNG TẢI KHÓA BẢO MẬT: Nếu hệ thống thiếu file gpg, tải trực tiếp bản mới nhất từ Debian để xác thực kho
          if [ ! -f /usr/share/keyrings/debian-archive-keyring.gpg ]; then
            sudo mkdir -p /usr/share/keyrings
            sudo wget -qO /usr/share/keyrings/debian-archive-keyring.gpg https://debian.org || true
          fi
          
          # Tiến hành sinh lõi OS sạch bằng mạng IPv4 an toàn tuyệt đối
          sudo debootstrap --variant=minbase --no-check-gpg bookworm chroot_dir http://debian.org

      - name: Inject Clean Repositories Config
        run: |
          sudo rm -rf chroot_dir/etc/apt/sources.list.d/*
          sudo rm -f chroot_dir/etc/apt/sources.list
          
          sudo mkdir -p chroot_dir/etc/apt/sources.list.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/apt/sources.list
          deb http://debian.org bookworm main contrib non-free non-free-firmware
          deb http://debian.org bookworm-updates main contrib non-free non-free-firmware
          deb http://debian.org bookworm-security main contrib non-free non-free-firmware
          EOF

      - name: Synchronize Network DNS and Mount
        run: |
          sudo cp /etc/resolv.conf chroot_dir/etc/resolv.conf
          sudo mount --bind /dev chroot_dir/dev
          sudo mount --bind /proc chroot_dir/proc
          sudo mount --bind /sys chroot_dir/sys

      - name: Install Graphic Suite and Core Applications
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo chroot chroot_dir apt-get update
          
          # Cài đặt hệ thống đồ họa Mac-RedStar, bộ gõ Unikey và bộ cài đặt SSD Calamares
          sudo chroot chroot_dir apt-get install -y --no-install-recommends \
            linux-image-amd64 live-boot sudo ca-certificates \
            xorg xfce4 xfce4-goodies lightdm plank \
            network-manager network-manager-gnome wpasupplicant firefox-esr \
            fcitx5 fcitx5-unikey vlc libreoffice mousepad thunar \
            calamares calamares-settings-debian gparted git

      - name: Download and Inject Steam Standalone Package
        run: |
          wget -q https://steampowered.com -O chroot_dir/tmp/steam.deb
          export DEBIAN_FRONTEND=noninteractive
          sudo chroot chroot_dir dpkg --add-architecture i386
          sudo chroot chroot_dir apt-get update || true
          sudo chroot chroot_dir apt-get install -y -f --no-install-recommends /tmp/steam.deb
          sudo rm -f chroot_dir/tmp/steam.deb

      - name: Unmount System Filesystems
        if: always()
        run: |
          sudo umount -l chroot_dir/dev || true
          sudo umount -l chroot_dir/proc || true
          sudo umount -l chroot_dir/sys || true

      - name: Configure Auto-Login and User Account
        run: |
          sudo mkdir -p chroot_dir/etc/lightdm/lightdm.conf.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/lightdm/lightdm.conf.d/autologin.conf
          [Seat:*]
          autologin-user=duykhanh
          autologin-user-timeout=0
          user-session=xfce
          EOF

          sudo chroot chroot_dir useradd -m -s /bin/bash -g sudo duykhanh
          sudo chroot chroot_dir passwd -d duykhanh

          sudo mkdir -p chroot_dir/etc/sudoers.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/sudoers.d/g_sudo
          %sudo   ALL=(ALL:ALL) NOPASSWD: ALL
          EOF
          sudo chmod 0440 chroot_dir/etc/sudoers.d/g_sudo

      - name: Setup System AutoStart and Swap Optimization
        run: |
          sudo mkdir -p chroot_dir/home/duykhanh/.config/autostart
          
          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/plank.desktop
          [Desktop Entry]
          Type=Application
          Exec=plank
          Name=Plank Dock
          X-GNOME-Autostart-enabled=true
          EOF

          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/fcitx.desktop
          [Desktop Entry]
          Type=Application
          Exec=fcitx5 -d
          Name=Fcitx5 Input Method
          X-GNOME-Autostart-enabled=true
          EOF

          sudo mkdir -p chroot_dir/etc/X11/Xsession.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/X11/Xsession.d/95fcitx
          export GTK_IM_MODULE=fcitx5
          export QT_IM_MODULE=fcitx5
          export XMODIFIERS="@im=fcitx5"
          EOF

          sudo mkdir -p chroot_dir/etc/local.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/rc.local
          #!/bin/sh -e
          if [ ! -f /swapfile ]; then
              dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
          fi
          swapon /swapfile
          exit 0
          EOF
          sudo chmod +x chroot_dir/etc/rc.local

          sudo chown -R 1000:1000 chroot_dir/home/duykhanh

      - name: Compress Filesystem into SquashFS
        run: |
          mkdir -p image/live
          sudo mksquashfs chroot_dir image/live/filesystem.squashfs -comp xz -processors $(nproc)

      - name: Extract Kernel and Setup GRUB
        run: |
          cp chroot_dir/boot/vmlinuz* image/live/vmlinuz
          cp chroot_dir/boot/initrd* image/live/initrd.img
          
          mkdir -p image/boot/grub
          cat <<'EOF' > image/boot/grub/grub.cfg
          set timeout=5
          set default=0
          
          # SỬA ĐỒNG BỘ: Chuyển đổi cờ nạp boot từ boot=casper sang boot=live chuẩn nền Debian
          menuentry "Boot DuyKhanhOS Live (Auto-Login Mode)" {
              linux /live/vmlinuz boot=live quiet splash
              initrd /live/initrd.img
          }
          menuentry "Direct Install DuyKhanhOS to SSD" {
              linux /live/vmlinuz boot=live calamares quiet splash
              initrd /live/initrd.img
          }
          EOF

      - name: Generate Custom Bootable ISO
        run: |
          grub-mkrescue -o duykhanhos-production.iso image

      - name: Upload Finished System ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duykhanh-os-production-iso
          path: duykhanhos-production.iso
