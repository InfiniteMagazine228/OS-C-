name: Build DuyKhanhOS Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ISO Generation Tools on Host
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin mtools dosfstools wget rsync casper

      - name: Install All Graphic Apps Directly on Host Network
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get install -y --no-install-recommends \
            xorg xfce4 xfce4-goodies lightdm plank \
            network-manager network-manager-gnome wpasupplicant \
            vlc libreoffice mousepad thunar gparted git firefox

      - name: Structure Clean ISO Tree
        run: |
          sudo rm -rf chroot_dir image duykhanhos-production.iso
          mkdir -p chroot_dir
          mkdir -p image/live

          # SỬA LỖI ĐƯỜNG DẪN ĐĨA: Thêm dấu gạch chéo vào đuôi /$dir/ để copy đúng nội dung bên trong,
          # Cam kết cấu trúc đĩa Live ISO chuẩn 100%, không bị lỗi bin/bin hay etc/etc
          for dir in bin sbin usr lib lib64 etc home var; do
            if [ -d /$dir ]; then
              sudo cp -a /$dir/. chroot_dir/$dir/
            fi
          done

          sudo rm -rf chroot_dir/var/cache/apt/archives/*
          sudo rm -rf chroot_dir/var/lib/apt/lists/*

          sudo mkdir -p chroot_dir/proc chroot_dir/sys chroot_dir/dev chroot_dir/run chroot_dir/tmp chroot_dir/boot
          sudo chmod 1777 chroot_dir/tmp

      - name: Configure Auto-Login and User Account
        run: |
          sudo mkdir -p chroot_dir/etc/lightdm/lightdm.conf.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/lightdm/lightdm.conf.d/autologin.conf
          [Seat:*]
          autologin-user=duykhanh
          autologin-user-timeout=0
          user-session=xfce
          EOF

          sudo useradd -R chroot_dir -m -s /bin/bash -g sudo duykhanh || true
          sudo chroot chroot_dir passwd -d duykhanh || true

          sudo mkdir -p chroot_dir/etc/sudoers.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/sudoers.d/g_sudo
          %sudo   ALL=(ALL:ALL) NOPASSWD: ALL
          EOF
          sudo chmod 0440 chroot_dir/etc/sudoers.d/g_sudo

      - name: Setup System AutoStart Configuration
        run: |
          sudo mkdir -p chroot_dir/home/duykhanh/.config/autostart
          
          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/plank.desktop
          [Desktop Entry]
          Type=Application
          Exec=plank
          Name=Plank Dock
          X-GNOME-Autostart-enabled=true
          EOF

          sudo chown -R 1000:1000 chroot_dir/home/duykhanh

      - name: Compress System Core into SquashFS
        run: |
          sudo mksquashfs chroot_dir image/live/filesystem.squashfs -comp xz -processors $(nproc)

      - name: Extract Kernel and Setup GRUB Bootloader
        run: |
          sudo cp /boot/vmlinuz-$(uname -r) image/live/vmlinuz
          sudo cp /boot/initrd.img-$(uname -r) image/live/initrd.img
          
          mkdir -p image/boot/grub
          cat <<'EOF' > image/boot/grub/grub.cfg
          set timeout=10
          set default=0
          
          menuentry "1. Try DuyKhanhOS Live CD (Graphic Mode)" {
              linux /live/vmlinuz boot=casper quiet splash
              initrd /live/initrd.img
          }
          menuentry "2. Install DuyKhanhOS directly to Storage (Bootable Installer)" {
              linux /live/vmlinuz boot=casper toram calamares quiet splash
              initrd /live/initrd.img
          }
          EOF

      - name: Generate Production Bootable ISO
        run: |
          grub-mkrescue -o duykhanhos-production.iso image

      - name: Upload Finished System ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duykhanh-os-production-iso
          path: duykhanhos-production.iso
