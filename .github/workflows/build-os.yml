name: Build DuyKhanhOS Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ISO Generation Tools on Host
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin mtools dosfstools wget

      - name: Extract System Core via Safe Docker
        run: |
          if [ -d chroot_dir ]; then
            sudo umount -l chroot_dir/dev || true
            sudo umount -l chroot_dir/proc || true
            sudo umount -l chroot_dir/sys || true
          fi
          sudo rm -rf chroot_dir image duykhanhos-production.iso
          mkdir -p chroot_dir
          mkdir -p image/live
          
          docker create --name duykhanh_core ubuntu:noble
          docker export duykhanh_core | tar -C chroot_dir -xf -
          docker rm duykhanh_core

      - name: Wipe Ubuntu Pro ESM and Rebuild Repositories
        run: |
          # 1. PHÁ HỦY TẬN GỐC PLUGIN UBUNTU PRO CAUSE LỖI 404
          # Vô hiệu hóa file script chạy ngầm tự nắn dòng mạng của Canonical
          sudo rm -f chroot_dir/etc/apt/apt.conf.d/20apt-esm-infra || true
          sudo rm -f chroot_dir/etc/apt/apt.conf.d/60ubuntu-management || true
          
          # 2. Xóa sạch file cấu hình nguồn DEB822 ẩn cũ
          sudo rm -f chroot_dir/etc/apt/sources.list
          sudo rm -rf chroot_dir/etc/apt/sources.list.d/*
          sudo mkdir -p chroot_dir/etc/apt/sources.list.d
          
          # 3. Ghi đè cấu trúc DEB822 chuẩn trỏ thẳng về kho gương tĩnh của Mỹ
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/apt/sources.list.d/ubuntu.sources
          Types: deb
          URIs: http://ubuntu.com
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          # 4. Khóa cứng APT: Cấm tự nắn dòng mạng, vô hiệu hóa các thông báo check bản quyền Pro ngầm
          sudo mkdir -p chroot_dir/etc/apt/apt.conf.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/apt/apt.conf.d/99custom
          Acquire::https::Verify-Peer "false";
          Acquire::AllowInsecureRepositories "true";
          Acquire::http::AllowRedirect "false";
          Binary::apt::APT::Keep-Downloaded-Packages "0";
          APT::Periodic::Update-Package-Lists "0";
          EOF

      - name: Synchronize Network DNS
        run: |
          sudo cp /etc/resolv.conf chroot_dir/etc/resolv.conf

      - name: Fix Dev Null, Tmp Permission and Mount System
        run: |
          sudo rm -f chroot_dir/dev/null
          sudo mknod -m 666 chroot_dir/dev/null c 1 3
          
          sudo mkdir -p chroot_dir/tmp
          sudo chmod 1777 chroot_dir/tmp
          
          sudo mount --bind /dev chroot_dir/dev
          sudo mount --bind /proc chroot_dir/proc
          sudo mount --bind /sys chroot_dir/sys

      - name: Install Critical Network Layer
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # Ép lệnh apt chạy độc lập không kích hoạt các hook của ESM Pro
          sudo chroot chroot_dir apt-get -o APT::Update::Post-Invoke-Success::="" update
          sudo chroot chroot_dir apt-get install -y --allow-unauthenticated ca-certificates apt-transport-https gnupg curl

      - name: Install Graphic Suite and Core Applications
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo chroot chroot_dir apt-get -o APT::Update::Post-Invoke-Success::="" update
          
          # Cài đặt đầy đủ môi trường đồ họa Mac, bộ gõ Unikey, VLC, LibreOffice, Firefox và Calamares cài SSD
          sudo chroot chroot_dir apt-get install -y --allow-unauthenticated --no-install-recommends \
            linux-image-generic casper sudo systemd-sysv plymouth plymouth-themes \
            xorg xfce4 xfce4-goodies lightdm plank \
            network-manager network-manager-gnome wpasupplicant firefox \
            fcitx fcitx-unikey fcitx-config-gtk vlc libreoffice mousepad thunar \
            calamares calamares-settings-ubuntu-common calamares-settings-lubuntu gparted git

      - name: Tweak Installer for Post-Install USB Eject Prompt
        run: |
          sudo sed -i 's/prompt=.*/prompt=true/g' chroot_dir/etc/casper.conf || true
          sudo mkdir -p chroot_dir/etc/calamares/modules
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/calamares/modules/finished.conf
          ---
          restartNowMode: "user-checked"
          restartNowCommand: "systemctl reboot"
          EOF

      - name: Create Custom Boot Splash Screen
        run: |
          sudo mkdir -p chroot_dir/usr/share/plymouth/themes/duykhanhos
          sudo cat <<'EOF' | sudo tee chroot_dir/usr/share/plymouth/themes/duykhanhos/duykhanhos.script
          Window.SetBackgroundTopColor(0.0, 0.0, 0.0);
          Window.SetBackgroundBottomColor(0.0, 0.0, 0.0);
          logo.image = Image("logo.png");
          logo.sprite = Sprite(logo.image);
          logo.x = Window.GetX() + Window.GetWidth() / 2 - logo.image.GetWidth() / 2;
          logo.y = Window.GetY() + Window.GetHeight() / 2 - logo.image.GetHeight() / 2;
          logo.sprite.SetPosition(logo.x, logo.y, 1000);
          EOF

          sudo cat <<'EOF' | sudo tee chroot_dir/usr/share/plymouth/themes/duykhanhos/duykhanhos.plymouth
          [Plymouth Theme]
          Name=DuyKhanhOS Boot Splash
          Description=A clean custom boot splash for DuyKhanhOS
          ModuleName=script
          [script]
          ImageDir=/usr/share/plymouth/themes/duykhanhos
          ScriptFile=/usr/share/plymouth/themes/duykhanhos/duykhanhos.script
          EOF

          echo "DuyKhanhOS" > chroot_dir/usr/share/plymouth/themes/duykhanhos/logo.png
          sudo chroot chroot_dir plymouth-set-default-theme duykhanhos || true

      - name: Unmount System Filesystems
        if: always()
        run: |
          sudo umount -l chroot_dir/dev || true
          sudo umount -l chroot_dir/proc || true
          sudo umount -l chroot_dir/sys || true

      - name: Configure Auto-Login and User Account
        run: |
          sudo mkdir -p chroot_dir/etc/lightdm/lightdm.conf.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/lightdm/lightdm.conf.d/autologin.conf
          [Seat:*]
          autologin-user=duykhanh
          autologin-user-timeout=0
          user-session=xfce
          EOF

          sudo useradd -R chroot_dir -m -s /bin/bash -g sudo duykhanh || true
          sudo chroot chroot_dir passwd -d duykhanh || true

          sudo mkdir -p chroot_dir/etc/sudoers.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/sudoers.d/g_sudo
          %sudo   ALL=(ALL:ALL) NOPASSWD: ALL
          EOF
          sudo chmod 0440 chroot_dir/etc/sudoers.d/g_sudo

      - name: Setup System AutoStart and Swap Optimization
        run: |
          sudo mkdir -p chroot_dir/home/duykhanh/.config/autostart
          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/plank.desktop
          [Desktop Entry]
          Type=Application
          Exec=plank
          Name=Plank Dock
          X-GNOME-Autostart-enabled=true
          EOF

          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/fcitx.desktop
          [Desktop Entry]
          Type=Application
          Exec=fcitx -d
          Name=Fcitx Input Method
          X-GNOME-Autostart-enabled=true
          EOF

          sudo mkdir -p chroot_dir/etc/local.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/rc.local
          #!/bin/sh -e
          if [ ! -f /swapfile ]; then
              dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
          fi
          swapon /swapfile
          exit 0
          EOF
          sudo chmod +x chroot_dir/etc/rc.local

          sudo chown -R 1000:1000 chroot_dir/home/duykhanh

      - name: Compress Filesystem into SquashFS
        run: |
          mkdir -p image/live
          sudo mksquashfs chroot_dir image/live/filesystem.squashfs -comp xz -processors $(nproc)

      - name: Extract Kernel and Setup GRUB Bootloader
        run: |
          sudo cp chroot_dir/boot/vmlinuz* image/live/vmlinuz
          sudo cp chroot_dir/boot/initrd* image/live/initrd.img
          
          mkdir -p image/boot/grub
          cat <<'EOF' > image/boot/grub/grub.cfg
          set timeout=10
          set default=0
          
          menuentry "1. Try DuyKhanhOS Live CD (Graphic Mode)" {
              linux /live/vmlinuz boot=casper quiet splash splash=plymouth theme=duykhanhos
              initrd /live/initrd.img
          }
          menuentry "2. Install DuyKhanhOS directly to Storage (Bootable Installer)" {
              linux /live/vmlinuz boot=casper toram calamares quiet splash splash=plymouth theme=duykhanhos
              initrd /live/initrd.img
          }
          EOF

      - name: Generate Custom Bootable ISO
        run: |
          grub-mkrescue -o duykhanhos-production.iso image

      - name: Upload Finished System ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duykhanh-os-production-iso
          path: duykhanhos-production.iso
