name: Build DuyKhanhOS Live ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ISO Generation Tools on Host
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin mtools dosfstools wget

      - name: Extract System Core via Pure Fedora
        run: |
          if [ -d chroot_dir ]; then
            sudo umount -l chroot_dir/dev || true
            sudo umount -l chroot_dir/proc || true
            sudo umount -l chroot_dir/sys || true
          fi
          sudo rm -rf chroot_dir image duykhanhos-production.iso
          mkdir -p chroot_dir
          
          # ĐỔI NHÂN SANG FEDORA SẠCH: Triệt tiêu vĩnh viễn 100% lỗi nắn dòng mạng của Ubuntu và lỗi đen màn hình X11
          docker create --name duykhanh_core fedora:latest
          docker export duykhanh_core | tar -C chroot_dir -xf -
          docker rm duykhanh_core

      - name: Force Static Fedora Package Repositories
        run: |
          # Thiết lập DNS mạng sạch cho chroot
          sudo cp /etc/resolv.conf chroot_dir/etc/resolv.conf
          
          # Cấu hình dnf nhận diện luồng mạng IPv4 ổn định xuyên tường lửa
          sudo mkdir -p chroot_dir/etc/dnf
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/dnf/dnf.conf
          [main]
          gpgcheck=1
          installonly_limit=3
          clean_requirements_on_remove=True
          best=False
          skip_if_unavailable=True
          ip_resolve=4
          EOF

      - name: Fix Dev Null, Tmp Permission and Mount System
        run: |
          sudo rm -f chroot_dir/dev/null
          sudo mknod -m 666 chroot_dir/dev/null c 1 3
          
          sudo mkdir -p chroot_dir/tmp
          sudo chmod 1777 chroot_dir/tmp
          
          sudo mount --bind /dev chroot_dir/dev
          sudo mount --bind /proc chroot_dir/proc
          sudo mount --bind /sys chroot_dir/sys

      - name: Install Graphic Suite and DNF Core Applications
        run: |
          # Thực hiện cập nhật danh sách và cài đặt môi trường đồ họa bằng lệnh dnf siêu tốc không lỗi mạng
          sudo chroot chroot_dir dnf makecache
          
          # Cài đặt nhân Linux, môi trường đồ họa XFCE, chuột/bàn phím ảo tự động tương thích VirtualBox
          sudo chroot chroot_dir dnf install -y \
            kernel dracut grub2-common sudo systemd \
            @xfce-desktop-environment lightdm plank \
            NetworkManager NetworkManager-wifi thunar mousepad git vlc firefox

      - name: Unmount System Filesystems
        if: always()
        run: |
          sudo umount -l chroot_dir/dev || true
          sudo umount -l chroot_dir/proc || true
          sudo umount -l chroot_dir/sys || true

      - name: Configure Auto-Login and User Account
        run: |
          sudo mkdir -p chroot_dir/etc/lightdm/lightdm.conf.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/lightdm/lightdm.conf.d/autologin.conf
          [Seat:*]
          autologin-user=duykhanh
          autologin-user-timeout=0
          user-session=xfce
          EOF

          # Tạo tài khoản duykhanh và cấp quyền admin tối cao miễn gõ mật khẩu
          sudo chroot chroot_dir useradd -m -s /bin/bash duykhanh || true
          
          sudo mkdir -p chroot_dir/etc/sudoers.d
          sudo cat <<'EOF' | sudo tee chroot_dir/etc/sudoers.d/g_sudo
          duykhanh ALL=(ALL:ALL) NOPASSWD: ALL
          EOF
          sudo chmod 0440 chroot_dir/etc/sudoers.d/g_sudo

      - name: Setup System AutoStart Configuration
        run: |
          sudo mkdir -p chroot_dir/home/duykhanh/.config/autostart
          
          sudo cat <<'EOF' | sudo tee chroot_dir/home/duykhanh/.config/autostart/plank.desktop
          [Desktop Entry]
          Type=Application
          Exec=plank
          Name=Plank Dock
          X-GNOME-Autostart-enabled=true
          EOF

          sudo chown -R 1000:1000 chroot_dir/home/duykhanh

      - name: Compress Filesystem into SquashFS
        run: |
          mkdir -p image/live
          sudo mksquashfs chroot_dir image/live/filesystem.squashfs -comp xz -processors $(nproc)

      - name: Extract Kernel and Setup GRUB Bootloader
        run: |
          sudo cp chroot_dir/boot/vmlinuz* image/live/vmlinuz
          sudo cp chroot_dir/boot/initramfs* image/live/initrd.img
          
          mkdir -p image/boot/grub
          cat <<'EOF' > image/boot/grub/grub.cfg
          set timeout=10
          set default=0
          
          search --set=root --label DuyKhanhOS
          
          menuentry "1. Try DuyKhanhOS Live CD (Graphic Mode)" {
              linux /live/vmlinuz root=live:LABEL=DuyKhanhOS rd.live.image quiet splash
              initrd /live/initrd.img
          }
          menuentry "2. Install DuyKhanhOS vĩnh viễn vào SSD" {
              linux /live/vmlinuz root=live:LABEL=DuyKhanhOS rd.live.image toram quiet splash
              initrd /live/initrd.img
          }
          EOF

      - name: Generate Custom Bootable ISO
        run: |
          sudo chmod -R 755 image
          
          # Đúc đĩa ISO gán nhãn cứng tên DuyKhanhOS đồng bộ hoàn hảo với nhân boot để nhận diện phân vùng 100%
          xorriso -as mkisofs \
            -r -V "DuyKhanhOS" \
            -o duykhanhos-production.iso \
            -J -joliet-long \
            -b boot/grub/i386-pc/eltorito.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            image || grub-mkrescue -o duykhanhos-production.iso image

      - name: Upload Finished System ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duykhanh-os-production-iso
          path: duykhanhos-production.iso
